# [INPUT]: 官方 base/web/beta.22 profile 行、preset 服务隔离契约与 Android 无桌面子进程/PTY 的能力边界
# [OUTPUT]: 以 mobile 为默认会话 preset，保留文本文件与 WebUI，关闭桌面命令和不可用附件能力
# [POS]: mobile 引擎的官方 profile overlay，不复制上游会话或模型协议
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: false
- id: hmr
  disabled: true
- id: bash-sandbox
  disabled: true
- id: tool-bash
  disabled: true
- id: office-kit
  disabled: true
- id: skill-office
  disabled: true
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: ui-sidebar-terminal
  disabled: true
- id: terminal-controller
  disabled: true
- id: attachment-local
  disabled: true
- id: ui-attachment
  disabled: true
- id: agent-preset-registry
  config:
    default: mobile
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- insert:
    - id: mobile-shell
      name: 'MOBILE_SHELL_FILE'
    - id: mobile-attachments
      name: 'MOBILE_ATTACHMENTS_FILE'
    - id: preset-mobile
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mobile
        name: 手机工作区
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful assistant running inside an Android application. You can read and edit text files in the private workspace. Bash, PTY, desktop applications, office rendering, image reading, and attachments are unavailable.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
              readImage: false
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-device-info
            name: 'MOBILE_DEVICE_TOOL_FILE'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
