# [INPUT]: 官方 base/web/beta.23 profile 行、preset 服务隔离契约与 Android 无桌面子进程/PTY 的能力边界
# [OUTPUT]: 以 mobile 为默认会话 preset，保留官方 WebUI，并按宿主能力选择附件存储和界面
# [POS]: mobile 引擎的官方 profile overlay，不复制上游会话或模型协议
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: false
- id: hmr
  disabled: true
- id: bash-sandbox
  disabled: true
- id: tool-bash
  disabled: true
- id: office-kit
  disabled: true
- id: skill-office
  disabled: true
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: ui-sidebar-terminal
  disabled: true
- id: terminal-controller
  disabled: true
- id: attachment-local
  disabled: true
- id: ui-attachment
  disabled: MOBILE_ATTACHMENTS_DISABLED
- id: agent-preset-registry
  config:
    default: mobile
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- insert:
    - id: mobile-shell
      name: 'MOBILE_SHELL_FILE'
    - id: mobile-attachments
      name: 'MOBILE_ATTACHMENTS_FILE'
    - id: preset-mobile
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: mobile
        name: 手机工作区
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful assistant running inside a mobile application. You can read and edit text files in the private workspace. Native mobile tools are available only when advertised by this device. System editors return opened, not proof of saving, sending or calling. Bash, PTY, desktop applications, and office rendering are unavailable. MOBILE_ATTACHMENTS_INSTRUCTIONS
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
              readImage: MOBILE_ATTACHMENTS_ENABLED
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-mobile-native
            name: 'MOBILE_NATIVE_TOOL_FILE'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
